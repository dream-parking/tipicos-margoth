<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de venta · Café Santa Cruz POS</title>
  <link rel="icon" href="img/logoRecortado.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400&family=Inter+Tight:wght@500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/pages/pos.js"></script>
</head>

<body data-auth="pendiente">
  <header data-app-header></header>
  <div class="auth-check" aria-hidden="true"><span class="spinner"></span></div>

  <main class="app-main">
    <div class="app-title">
      <div>
        <p class="eyebrow">Caja · Venta</p>
        <h1>Punto de venta</h1>
      </div>
    </div>

    <div class="pos">
      <section class="pos__catalogo" aria-label="Productos">
        <form class="pos__busqueda" role="search" onsubmit="return false">
          <label class="sr-only" for="buscar">Buscar producto</label>
          <input class="input" type="search" id="buscar" placeholder="Buscar producto…" autocomplete="off">
        </form>
        <div class="pos__tabs" id="tabs" role="group" aria-label="Categorías"></div>
        <div id="productos"></div>
      </section>

      <aside class="pos__ticket card" aria-label="Ticket de venta">
        <h2>Ticket</h2>
        <ul class="pos__lineas" id="lineas"></ul>

        <dl class="pos__totales">
          <div><dt>Subtotal</dt><dd id="subtotal">$0.00</dd></div>
          <div><dt>Descuento</dt><dd id="descuento-monto">$0.00</dd></div>
          <div class="pos__total"><dt>Total</dt><dd id="total">$0.00</dd></div>
        </dl>

        <div class="field">
          <label for="descuento">Descuento (%) · máximo 20</label>
          <input class="input" type="number" id="descuento" min="0" max="20" step="1" value="0">
        </div>
        <div class="field" id="campo-motivo" hidden>
          <label for="motivo">Motivo del descuento</label>
          <input class="input" type="text" id="motivo" maxlength="80" autocomplete="off">
        </div>

        <div class="field">
          <label for="metodo">Método de pago</label>
          <select class="select" id="metodo">
            <option value="efectivo">Efectivo</option>
            <option value="tarjeta">Tarjeta</option>
          </select>
        </div>
        <div class="field" id="campo-efectivo">
          <label for="recibido">Efectivo recibido</label>
          <input class="input" type="number" id="recibido" min="0" step="0.01" inputmode="decimal">
          <p class="field__hint" id="cambio">Cambio: $0.00</p>
        </div>

        <p class="field__error" id="error-cobro" hidden></p>
        <button type="button" class="btn btn--primary btn--block btn--lg" id="btn-cobrar">Cobrar</button>
      </aside>
    </div>
  </main>
</body>
</html>
