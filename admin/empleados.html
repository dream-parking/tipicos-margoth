<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empleados · Café Santa Cruz POS</title>
  <link rel="icon" href="../img/logoRecortado.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400&family=Inter+Tight:wght@500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/app.css">
  <script type="module" src="../js/pages/empleados.js"></script>
</head>
<body data-auth="pendiente">
  <header data-app-header></header>
  <div class="auth-check" aria-hidden="true"><span class="spinner"></span></div>

  <main class="app-main">
    <div class="app-title">
      <div>
        <p class="eyebrow">Administración · Equipo</p>
        <h1>Empleados</h1>
        <p>Activa las cuentas nuevas y asigna los roles del equipo.</p>
      </div>
      <button type="button" id="btn-recargar" class="btn btn--light btn--sm">
        <svg class="btn__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        Actualizar
      </button>
    </div>

    <section aria-label="Resumen del equipo" class="stats" id="resumen"></section>

    <section class="panel-datos" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista" class="sr-only">Lista de empleados</h2>
      <form class="toolbar" id="filtros" role="search" onsubmit="return false">
        <label class="sr-only" for="buscar">Buscar por nombre o correo</label>
        <input class="input" type="search" id="buscar" name="texto" placeholder="Buscar por nombre o correo">
        <label class="sr-only" for="filtro-rol">Filtrar por rol</label>
        <select class="select" id="filtro-rol" name="rol">
          <option value="todos">Todos los roles</option>
          <option value="admin">Administradores</option>
          <option value="cajero">Cajeros</option>
        </select>
        <label class="sr-only" for="filtro-estado">Filtrar por estado</label>
        <select class="select" id="filtro-estado" name="estado">
          <option value="todos">Todos los estados</option>
          <option value="activo">Activos</option>
          <option value="inactivo">Pendientes</option>
        </select>
      </form>
      <p class="conteo" id="conteo" aria-live="polite"></p>
      <div id="lista" class="tabla-wrap"></div>
    </section>
  </main>

  <footer class="app-footer"><span>© 2026 Café Santa Cruz</span><span>POS · v1.0</span></footer>
</body>
</html>
